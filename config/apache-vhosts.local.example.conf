# Copie este bloco para o final de:
# C:\xampp\apache\conf\extra\httpd-vhosts.conf
#
# Depois reinicie o Apache no XAMPP Control Panel.
# Requer entradas no arquivo hosts do Windows (ver docs/guides/deploy-multi-tenant.md).

<VirtualHost *:80>
    ServerName bmc.local
    DocumentRoot "C:/xampp/htdocs/bmc_barros/public"
    <Directory "C:/xampp/htdocs/bmc_barros/public">
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>

<VirtualHost *:80>
    ServerName demo.local
    DocumentRoot "C:/xampp/htdocs/bmc_barros/public"
    <Directory "C:/xampp/htdocs/bmc_barros/public">
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
